<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="70%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Outer Tech Ring with ticks -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="8,12" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="#0f172a" stroke="#0284c7" stroke-width="4"/>

  <!-- 10 Palladium Coils -->
  <g id="coils">
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(36 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(72 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(108 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(144 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(180 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(216 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(252 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(288 256 256)" />
    <rect x="248" y="102" width="16" height="28" rx="3" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" transform="rotate(324 256 256)" />
  </g>

  <!-- Glowing Inner Ring -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="#00e5ff" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Glowing Center Core -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Center Holographic J -->
  <text x="256" y="278" font-family="'Chakra Petch', sans-serif, monospace" font-size="64" font-weight="900" fill="#030712" text-anchor="middle">J</text>
</svg>
